<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email & File Manager</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <!-- HEADER DA PÁGINA -->
    <header>
      <div class="container">
        <div>
          <h1><i class="bi bi-envelope-at-fill"></i> Email & File Manager</h1>
          <p>Gerencie seus recebimentos com elegância</p>
        </div>
        <div class="header-actions">
          <button class="btn-export btn-small" id="exportXlsxBtn">
            <i class="bi bi-filetype-xlsx"></i> XLSX
          </button>
          <button class="btn-primary" id="newRecordBtn">
            <i class="bi bi-plus-circle"></i> Novo
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN DA PÁGINA -->
    <main class="container">
      <!-- Alertas de cadastro, remoção, alteração e demais eventos -->
      <div id="alert" class="alert"></div>

      <!-- Seletor de datas -->
      <div class="date-selector">
        <div class="date-selector-nav">
          <button class="btn-secondary" id="prevDayBtn">
            <i class="bi bi-arrow-left"></i> Dia Anterior
          </button>
          <button class="btn-secondary" id="todayBtn">Hoje</button>
          <button class="btn-secondary" id="nextDayBtn">
            Próximo dia <i class="bi bi-arrow-right"></i>
          </button>
        </div>

        <div class="date-display">
          <div class="label">Data Selecionada</div>
          <div class="value" id="selectedDate">--/--/----</div>
        </div>
      </div>

      <!-- CARTÕES DE RESUMO DA PÁGINA -->
      <div class="summary">
        <div class="summary-card">
          <div class="summary-card-label">Total de Registros</div>
          <div class="summary-card-value">
            <span class="summary-card-icon"
              ><i class="bi bi-clipboard-check"></i
            ></span>
            <span id="totalRecords">0</span>
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-card-label">Total de Quantidade</div>
          <div class="summary-card-value">
            <span class="summary-card-icon"
              ><i class="bi bi-clipboard-data"></i
            ></span>
            <span id="totalQuantity">0</span>
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-card-label">Cidades Únicas</div>
          <div class="summary-card-value">
            <span class="summary-card-icon"
              ><i class="bi bi-buildings"></i
            ></span>
            <span id="totalCities">0</span>
          </div>
        </div>
      </div>

      <!-- FORMULÁRIO DE REGISTRO -->
      <div class="form-section">
        <h2>Novo Registro</h2>
        <form id="recordForm">
          <div class="form-row">
            <div class="form-group">
              <label for="cityName">Nome da Cidade *</label>
              <input
                type="text"
                id="cityName"
                required
                placeholder="ex: Caxambu"
              />
            </div>

            <div class="form-group">
              <label for="organType">Órgão *</label>
              <select id="organType" required>
                <option value="">-- Selecione --</option>
                <option value="PM">Prefeitura (PM)</option>
                <option value="CM">Câmara (CM)</option>
                <option value="">Outro</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="content">Conteúdo Publicado *</label>
            <textarea
              id="content"
              required
              placeholder="Descreva o conteúdo publicado..."
            ></textarea>
          </div>

          <div class="form-group">
            <label for="quantity">Quantidade *</label>
            <input
              type="number"
              id="quantity"
              min="1"
              required
              placeholder="0"
            />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">
              <i class="bi bi-floppy"></i> Salvar Registro
            </button>
            <button type="reset" class="btn-secondary">
              <i class="bi bi-arrow-repeat"></i> Limpar
            </button>
          </div>
        </form>
      </div>

      <!-- PESQUISA POR CIDADES -->
      <div class="form-section">
        <h2><i class="bi bi-search"></i> Pesquisar Cidade</h2>

        <!-- <div class="form-group"> -->
        <div class="search-row">
          <input
            type="text"
            id="searchCity"
            placeholder="Digite o nome da cidade..."
          />
          <button class="btn-export btn-small" id="exportSearchBtn">
            <i class="bi bi-file-earmark-arrow-down"></i> Exportar Pesquisa
          </button>
        </div>

        <div id="searchResults"></div>
      </div>

      <!-- SEÇÃO DE CIDADES REGISTRADAS NO DIA -->
      <div class="records-section">
        <h2>Registro por cidade</h2>
        <div id="recordsList"></div>
      </div>

      <!-- RESUMO DIÁRIO -->
      <div class="daily-summary">
        <h2><i class="bi bi-bar-chart-line"></i> Resumo Diário</h2>
        <div class="summary-stats">
          <div class="summary-stat">
            <div class="summary-stat-label">Total de Registros</div>
            <div class="summary-stat-value" id="summaryTotalRecords">0</div>
          </div>
          <div class="summary-stat">
            <div class="summary-stat-label">Total de Quantidade</div>
            <div class="summary-stat-value" id="summaryTotalQuantity">0</div>
          </div>
          <div class="summary-stat">
            <div class="summary-stat-label">Cidades</div>
            <div class="summary-stat-value" id="summaryTotalCities">0</div>
          </div>
        </div>
      </div>
    </main>

    <!-- MODAL PARA EDIÇÃO DE REGISTROS -->
    <div id="editModal" class="modal">
      <div class="modal-content">
        <button class="modal-close" id="closeModalBtn">
          <i class="bi bi-x"></i>
        </button>
        <div class="modal-header">Editar Registro</div>
        <form id="editForm">
          <input type="hidden" id="editRecordId" />
          <div class="form-row">
            <div class="form-group">
              <label for="editCityName">Nome da Cidade</label>
              <input type="text" id="editCityName" required />
            </div>
            <div class="form-group">
              <label for="editOrganType">Órgão</label>
              <select id="editOrganType" required>
                <option value="">-- Selecione --</option>
                <option value="PM">Prefeitura (PM)</option>
                <option value="CM">Câmara (CM)</option>
                <option value="">Outro</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="editContent">Conteúdo Publicado</label>
            <textarea id="editContent" required></textarea>
          </div>

          <div class="form-group">
            <label for="editQuantity">Quantidade</label>
            <input type="number" id="editQuantity" min="1" required />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">
              <i class="bi bi-floppy"></i> Atualizar
            </button>
            <button type="button" class="btn-secondary" id="cancelEditBtn">
              <i class="bi bi-x-lg"></i> Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
